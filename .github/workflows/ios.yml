name: Build unsigned IPA

on:
  workflow_dispatch:   # déclenchement manuel
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project MonProjet.xcodeproj \
            -scheme MonProjet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          mkdir -p unsigned/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/MonProjet.app unsigned/Payload/
          cd unsigned
          zip -r ../MonProjet-unsigned.ipa Payload/
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: MonProjet-unsigned.ipa
          retention-days: 30   